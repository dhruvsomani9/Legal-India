<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Dark Emblem Background Disc -->
  <rect width="64" height="64" rx="16" fill="#0C1322" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Tricolor Accent Ring -->
  <circle cx="32" cy="32" r="26" stroke="url(#fav-tricolor)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Justice Pillar (Base & Shaft) in Gold -->
  <path d="M22 52H42V49H22V52Z" fill="#F59E0B" />
  <path d="M26 49H38V46H26V49Z" fill="#D97706" />
  <rect x="30.5" y="18" width="3" height="28" rx="1.5" fill="#F59E0B" />

  <!-- Ashoka Chakra Center Hub -->
  <circle cx="32" cy="20" r="4.5" fill="#1E3A8A" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="32" cy="20" r="1.5" fill="#FCD34D" />

  <!-- Balance Beam -->
  <rect x="14" y="19" width="36" height="2.5" rx="1.25" fill="#FCD34D" />

  <!-- Left Scale Pan & Strings (Indian Saffron) -->
  <path d="M16 21.5L10 35M16 21.5L22 35" stroke="#FF671F" stroke-width="1.2" stroke-linecap="round" />
  <path d="M8 35C8 38.5 11.5 41 16 41C20.5 41 24 38.5 24 35H8Z" fill="#FF671F" />

  <!-- Right Scale Pan & Strings (Indian Green) -->
  <path d="M48 21.5L42 35M48 21.5L54 35" stroke="#16A34A" stroke-width="1.2" stroke-linecap="round" />
  <path d="M40 35C40 38.5 43.5 41 48 41C52.5 41 56 38.5 56 35H40Z" fill="#16A34A" />

  <!-- Top Finial -->
  <polygon points="32,10 30,15 34,15" fill="#FCD34D" />

  <!-- Gradients -->
  <defs>
    <linearGradient id="fav-tricolor" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF671F" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
  </defs>
</svg>
